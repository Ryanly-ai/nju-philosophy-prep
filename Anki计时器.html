<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Anki 循环计时器</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0f1115; color: #e8e8e8;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 28px;
    transition: background-color 0.4s ease;
  }
  body.flash { background: #2a1a1a; }
  body.running { background: #0f1115; }
  body.paused  { background: #1a1a0f; }

  .time {
    font-variant-numeric: tabular-nums;
    font-weight: 200;
    font-size: clamp(120px, 28vw, 320px);
    letter-spacing: -0.04em;
    line-height: 1;
    cursor: pointer;
  }

  .settings {
    display: flex; align-items: center; gap: 12px;
    font-size: 16px; color: #999;
  }
  .settings input {
    width: 70px;
    padding: 8px 10px;
    font-size: 16px;
    background: #1a1d24;
    border: 1px solid #2a2f3a;
    color: #e8e8e8;
    border-radius: 8px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .settings input:focus { outline: none; border-color: #4a90e2; }

  .controls { display: flex; gap: 12px; }
  button {
    padding: 12px 28px;
    font-size: 16px;
    background: #1a1d24;
    border: 1px solid #2a2f3a;
    color: #e8e8e8;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  button:hover { background: #242935; }
  button:active { transform: scale(0.97); }
  button.primary { background: #2a5da8; border-color: #2a5da8; }
  button.primary:hover { background: #356bbd; }

  .info {
    font-size: 14px;
    color: #666;
    display: flex; gap: 18px;
  }
  .info .round-num { color: #aaa; }

  .hint {
    font-size: 12px;
    color: #555;
    position: fixed;
    bottom: 16px;
  }
</style>
</head>
<body class="paused">
  <div class="settings">
    <span>每轮</span>
    <input id="minutes" type="number" min="0" max="180" value="2">
    <span>分</span>
    <input id="seconds" type="number" min="0" max="59" value="0">
    <span>秒</span>
  </div>

  <div id="display" class="time" title="点击开始/暂停">02:00</div>

  <div class="controls">
    <button id="startBtn" class="primary">开始</button>
    <button id="resetBtn">重置</button>
    <button id="muteBtn">🔔 提示音开</button>
  </div>

  <div class="info">
    <span class="round-num">第 <span id="round">0</span> 轮</span>
    <span>累计 <span id="total">0</span> 分钟</span>
  </div>

  <div class="hint">空格：开始/暂停　·　R：重置　·　点击时间也可控制</div>

<script>
(() => {
  const minInput = document.getElementById('minutes');
  const secInput = document.getElementById('seconds');
  const display  = document.getElementById('display');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const muteBtn  = document.getElementById('muteBtn');
  const roundEl  = document.getElementById('round');
  const totalEl  = document.getElementById('total');
  const body     = document.body;

  let total = 120;       // 当前轮总秒数
  let remaining = 120;   // 剩余秒数
  let running = false;
  let muted = false;
  let endAt = 0;         // 当前轮结束时间戳
  let raf = null;
  let round = 0;
  let totalMin = 0;

  function configSeconds() {
    const m = Math.max(0, parseInt(minInput.value, 10) || 0);
    const s = Math.max(0, Math.min(59, parseInt(secInput.value, 10) || 0));
    return m * 60 + s;
  }

  function fmt(sec) {
    sec = Math.max(0, Math.ceil(sec));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function render() {
    display.textContent = fmt(remaining);
    document.title = (running ? '▶ ' : '⏸ ') + fmt(remaining) + ' · Anki';
  }

  function setBodyState(state) {
    body.classList.remove('running', 'paused', 'flash');
    body.classList.add(state);
  }

  // Web Audio 生成 beep，不需要外部资源
  let audioCtx = null;
  function beep() {
    if (muted) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      // 三连短音
      [0, 0.18, 0.36].forEach((t, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880 + i * 110;
        gain.gain.setValueAtTime(0.0001, now + t);
        gain.gain.exponentialRampToValueAtTime(0.25, now + t + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.15);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now + t);
        osc.stop(now + t + 0.17);
      });
    } catch (e) { /* ignore */ }
  }

  function flash() {
    body.classList.add('flash');
    setTimeout(() => {
      if (running) setBodyState('running');
      else setBodyState('paused');
    }, 600);
  }

  function tick() {
    if (!running) return;
    remaining = (endAt - Date.now()) / 1000;
    if (remaining <= 0) {
      // 一轮结束：响铃、计数、自动开始下一轮
      beep();
      flash();
      round += 1;
      totalMin += Math.round(total / 60 * 10) / 10;
      roundEl.textContent = round;
      totalEl.textContent = (Math.round(totalMin * 10) / 10).toString().replace(/\.0$/, '');
      // 重新读取设置（用户可能中途改了时长）
      total = configSeconds() || total;
      remaining = total;
      endAt = Date.now() + total * 1000;
    }
    render();
    raf = requestAnimationFrame(tick);
  }

  function start() {
    if (running) return;
    if (remaining <= 0) {
      total = configSeconds();
      remaining = total;
    } else if (remaining === total && remaining === 0) {
      total = configSeconds();
      remaining = total;
    }
    if (remaining <= 0) return; // 设置为 0 不启动
    endAt = Date.now() + remaining * 1000;
    running = true;
    startBtn.textContent = '暂停';
    setBodyState('running');
    // 解锁 AudioContext（必须在用户手势内）
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
    raf = requestAnimationFrame(tick);
  }

  function pause() {
    if (!running) return;
    running = false;
    cancelAnimationFrame(raf);
    remaining = Math.max(0, (endAt - Date.now()) / 1000);
    startBtn.textContent = '继续';
    setBodyState('paused');
    render();
  }

  function toggle() {
    if (running) pause(); else start();
  }

  function reset() {
    running = false;
    cancelAnimationFrame(raf);
    total = configSeconds();
    remaining = total;
    startBtn.textContent = '开始';
    setBodyState('paused');
    render();
  }

  function applyConfig() {
    if (running) return; // 运行中不重置当前轮，下轮自动应用
    total = configSeconds();
    remaining = total;
    render();
  }

  startBtn.addEventListener('click', toggle);
  resetBtn.addEventListener('click', reset);
  display.addEventListener('click', toggle);
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔕 提示音关' : '🔔 提示音开';
  });
  minInput.addEventListener('change', applyConfig);
  secInput.addEventListener('change', applyConfig);

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'r' || e.key === 'R') { reset(); }
  });

  reset();
})();
</script>
</body>
</html>
